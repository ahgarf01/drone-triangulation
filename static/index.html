<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Single-Station AoA Interface</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 0; }
    header { padding: 12px 16px; background: #f2f2f2; border-bottom: 1px solid #ddd; }
    .wrap { display: grid; grid-template-columns: 360px 1fr; gap: 12px; padding: 12px; }
    .card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; }
    #map { width: 100%; height: 650px; border: 1px solid #ddd; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 6px; border-bottom: 1px solid #eee; font-size: 14px; text-align: left; }
    .muted { color: #666; font-size: 12px; }
    .row { margin-top: 8px; }
    .btn { padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
    .foot { padding: 8px 16px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>Single-Station AoA Interface</strong>
    <span class="muted"> • Live bearing display from station 1</span>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="row">
        <button id="refresh" class="btn">Refresh Now</button>
      </div>

      <div class="row muted">
        One-station angle-of-arrival demo. Green marker = station, blue line = measured bearing.
      </div>

      <div class="row">
        <table id="estimates">
          <thead>
            <tr>
              <th>Drone</th>
              <th>Freq (MHz)</th>
              <th>Angle (deg)</th>
              <th>Last Update</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div id="map"></div>
    </div>
  </div>

  <div class="foot">
    Single-station AoA visualization. No triangulation or position estimate is shown.
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="/static/map.js"></script>
</body>
</html>
